<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1942" viewBox="0 0 1024 1942" role="img" aria-labelledby="title desc">
  <title id="title">One later iHC transformer layer: Attention followed by FFN/MoE</title>
  <desc id="desc">For one token, four already different 6,144-wide residual streams enter an Attention half and then an FFN/MoE half. In each half, a learned gate generator reads all four incoming streams and produces four pre gates and four post gates before branch computation. The pre gates form a weighted reduction to one 6,144-wide vector, followed by RMSNorm and one Attention or MoE application. The shared branch output is added to each stream with that stream's post gate while each stream's own identity path is preserved. The MoE input feeds a router for routed experts and a shared expert in parallel. The two halves have separate learned gate parameters.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#202b32"/></marker>
    <marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#18716a"/></marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#37699a"/></marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #202b32; font-size: 18px; }
      .heading { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
      .label { font-size: 17px; }
      .small { font-size: 16px; }
      .muted { fill: #5b676c; }
      .bold { font-weight: 650; }
      .math { font-family: "Cambria Math", "DejaVu Sans", Arial, sans-serif; font-size: 22px; }
      .teal { fill: #18716a; }
      .blue { fill: #37699a; }
      .flow { fill: none; stroke: #202b32; stroke-width: 2.2; stroke-linejoin: round; marker-end: url(#arrow); }
      .identity { fill: none; stroke: #18716a; stroke-width: 3; stroke-linejoin: round; marker-end: url(#teal-arrow); }
      .gate { fill: none; stroke: #37699a; stroke-width: 2.2; stroke-dasharray: 7 5; stroke-linejoin: round; marker-end: url(#blue-arrow); }
      .box { fill: #ffffff; stroke: #bec8cc; stroke-width: 1.4; }
      .gatebox { fill: #edf3fa; stroke: #93acc5; stroke-width: 1.4; }
      .updatebox { fill: #edf5f2; stroke: #6daba4; stroke-width: 1.6; }
      .carrier { fill: #edf5f2; stroke: #6daba4; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1024" height="1942" fill="#faf9f6"/>
  <text x="40" y="48" font-size="29" font-weight="700">One later iHC transformer layer</text>
  <text x="40" y="80" class="label muted">One token · four already different residual streams · 6,144 features per stream</text>
  <path d="M42 111H87" stroke="#18716a" stroke-width="3"/>
  <text x="97" y="117" class="small">Identity path</text>
  <path d="M260 111H305" stroke="#37699a" stroke-width="2.2" stroke-dasharray="7 5"/>
  <text x="315" y="117" class="small">Generated gates</text>
  <path d="M518 111H563" stroke="#202b32" stroke-width="2.2"/>
  <text x="573" y="117" class="small">Vector computation</text>

  <!-- ATTENTION HALF -->
  <rect x="20" y="143" width="984" height="738" rx="16" fill="#f4f5f3" stroke="#d9dfdc"/>
  <text x="44" y="179" class="heading">1  ATTENTION HALF</text>
  <text x="976" y="179" text-anchor="end" class="label muted">4 × 6,144 → 6,144 → 4 × 6,144</text>

  <!-- All arrows precede their labels and boxes. -->
  <path d="M503 261V286H830V317" class="flow"/>
  <path d="M503 286V349" class="flow"/>
  <path d="M503 279H65V726H320" class="identity"/>
  <path d="M503 284H77V741H320" class="identity"/>
  <path d="M503 289H89V756H320" class="identity"/>
  <path d="M503 294H101V771H320" class="identity"/>
  <path d="M704 370H679V386H650" class="gate"/>
  <path d="M953 409H975V752H957" class="gate"/>
  <path d="M493 422V451" class="flow"/>
  <path d="M493 493V521" class="flow"/>
  <path d="M704 552H650" class="flow"/>
  <path d="M493 580V612" class="flow"/>
  <path d="M493 663V712" class="flow"/>
  <path d="M639 788V814" class="flow"/>

  <rect x="45" y="199" width="932" height="62" rx="9" class="carrier"/>
  <text x="65" y="238" class="math bold">X</text>
  <line x1="112" y1="211" x2="112" y2="249" stroke="#a0c6bf"/>
  <line x1="326" y1="211" x2="326" y2="249" stroke="#a0c6bf"/>
  <line x1="540" y1="211" x2="540" y2="249" stroke="#a0c6bf"/>
  <line x1="754" y1="211" x2="754" y2="249" stroke="#a0c6bf"/>
  <text x="219" y="238" text-anchor="middle">x₁ · 6,144</text>
  <text x="433" y="238" text-anchor="middle">x₂ · 6,144</text>
  <text x="647" y="238" text-anchor="middle">x₃ · 6,144</text>
  <text x="861" y="238" text-anchor="middle">x₄ · 6,144</text>

  <text x="124" y="400" class="label teal bold">IDENTITY BYPASS</text>
  <text x="124" y="430" class="teal">x₁, x₂, x₃, x₄</text>
  <text x="124" y="458" class="label teal">kept separately</text>
  <text x="124" y="486" class="small muted">Each stream preserves</text>
  <text x="124" y="509" class="small muted">its own incoming vector.</text>

  <rect x="704" y="317" width="249" height="132" rx="10" class="gatebox"/>
  <text x="828.5" y="343" text-anchor="middle" class="blue bold">Learned iHC</text>
  <text x="828.5" y="365" text-anchor="middle" class="blue bold">gate generator</text>
  <text x="828.5" y="392" text-anchor="middle" class="small">reads all four X streams</text>
  <text x="828.5" y="424" text-anchor="middle" class="blue">4 pre aᴬ + 4 post bᴬ</text>
  <text x="694" y="339" text-anchor="end" class="small blue">aᴬ</text>
  <text x="716" y="478" class="small blue">Both gate sets come from X,</text>
  <text x="716" y="500" class="small blue">before Attention runs.</text>

  <rect x="335" y="349" width="315" height="73" rx="9" class="box"/>
  <text x="492.5" y="375" text-anchor="middle" class="label bold">Weighted stream reduction</text>
  <text x="492.5" y="405" text-anchor="middle" class="math">mᴬ = ∑ₛ aᴬₛ xₛ</text>
  <rect x="335" y="451" width="315" height="42" rx="8" class="box"/>
  <text x="492.5" y="478" text-anchor="middle" class="bold">uᴬ = RMSNorm(mᴬ)</text>
  <rect x="335" y="521" width="315" height="59" rx="9" class="box"/>
  <text x="492.5" y="548" text-anchor="middle" class="bold">One Attention application</text>
  <text x="492.5" y="569" text-anchor="middle" class="small muted">the shared branch</text>
  <rect x="704" y="529" width="249" height="67" rx="9" class="box"/>
  <text x="828.5" y="555" text-anchor="middle" class="label">Permitted context tokens</text>
  <text x="828.5" y="580" text-anchor="middle" class="small muted">used by Attention</text>
  <rect x="335" y="612" width="315" height="51" rx="8" class="box"/>
  <text x="492.5" y="634" text-anchor="middle" class="label bold">Shared branch output yᴬ</text>
  <text x="492.5" y="655" text-anchor="middle" class="small muted">one 6,144-vector</text>
  <text x="948" y="669" text-anchor="end" class="small blue">bᴬ: one write gate</text>
  <text x="948" y="691" text-anchor="end" class="small blue">for each stream</text>

  <rect x="320" y="712" width="637" height="76" rx="11" class="updatebox"/>
  <text x="639" y="738" text-anchor="middle" class="label bold">Add the same output, with a separate gate for each stream</text>
  <text x="639" y="773" text-anchor="middle" class="math">zₛ = xₛ + bᴬₛ yᴬ    for s = 1, 2, 3, 4</text>
  <rect x="45" y="814" width="932" height="47" rx="9" class="carrier"/>
  <text x="65" y="844" class="math bold">Z</text>
  <text x="219" y="844" text-anchor="middle">z₁</text>
  <text x="433" y="844" text-anchor="middle">z₂</text>
  <text x="647" y="844" text-anchor="middle">z₃</text>
  <text x="861" y="844" text-anchor="middle">z₄</text>

  <!-- Z is both the Attention output and the FFN/MoE input. -->

  <!-- FFN / MoE HALF -->
  <rect x="20" y="907" width="984" height="964" rx="16" fill="#f4f5f3" stroke="#d9dfdc"/>
  <path d="M503 861V963" class="flow"/>
  <text x="44" y="943" class="heading">2  FFN / MoE HALF</text>
  <text x="976" y="943" text-anchor="end" class="label muted">4 × 6,144 → 6,144 → 4 × 6,144</text>

  <path d="M503 1025V1050H830V1081" class="flow"/>
  <path d="M503 1050V1113" class="flow"/>
  <path d="M503 1043H65V1709H320" class="identity"/>
  <path d="M503 1048H77V1724H320" class="identity"/>
  <path d="M503 1053H89V1739H320" class="identity"/>
  <path d="M503 1058H101V1754H320" class="identity"/>
  <path d="M704 1134H679V1150H650" class="gate"/>
  <path d="M953 1173H975V1735H957" class="gate"/>
  <path d="M493 1186V1215" class="flow"/>
  <path d="M493 1257V1341" class="flow"/>
  <path d="M493 1322H818V1388" class="flow"/>
  <path d="M493 1395V1421" class="gate"/>
  <path d="M493 1322H318V1451H335" class="flow"/>
  <path d="M493 1481V1511H641" class="flow"/>
  <path d="M818 1453V1511H659" class="flow"/>
  <path d="M650 1520V1595" class="flow"/>
  <path d="M640 1646V1695" class="flow"/>
  <path d="M639 1771V1798" class="flow"/>

  <rect x="45" y="963" width="932" height="62" rx="9" class="carrier"/>
  <text x="65" y="1002" class="math bold">Z</text>
  <line x1="112" y1="975" x2="112" y2="1013" stroke="#a0c6bf"/>
  <line x1="326" y1="975" x2="326" y2="1013" stroke="#a0c6bf"/>
  <line x1="540" y1="975" x2="540" y2="1013" stroke="#a0c6bf"/>
  <line x1="754" y1="975" x2="754" y2="1013" stroke="#a0c6bf"/>
  <text x="219" y="1002" text-anchor="middle">z₁ · 6,144</text>
  <text x="433" y="1002" text-anchor="middle">z₂ · 6,144</text>
  <text x="647" y="1002" text-anchor="middle">z₃ · 6,144</text>
  <text x="861" y="1002" text-anchor="middle">z₄ · 6,144</text>

  <text x="124" y="1290" class="label teal bold">IDENTITY BYPASS</text>
  <text x="124" y="1320" class="teal">z₁, z₂, z₃, z₄</text>
  <text x="124" y="1348" class="label teal">kept separately</text>
  <text x="124" y="1376" class="small muted">The FFN half preserves</text>
  <text x="124" y="1399" class="small muted">each updated stream.</text>

  <rect x="704" y="1081" width="249" height="132" rx="10" class="gatebox"/>
  <text x="828.5" y="1107" text-anchor="middle" class="blue bold">Learned iHC</text>
  <text x="828.5" y="1129" text-anchor="middle" class="blue bold">gate generator</text>
  <text x="828.5" y="1156" text-anchor="middle" class="small">reads all four Z streams</text>
  <text x="828.5" y="1188" text-anchor="middle" class="blue">4 pre aᶠ + 4 post bᶠ</text>
  <text x="694" y="1103" text-anchor="end" class="small blue">aᶠ</text>
  <text x="716" y="1242" class="small blue">New gates from Z;</text>
  <text x="716" y="1264" class="small blue">separate learned parameters.</text>

  <rect x="335" y="1113" width="315" height="73" rx="9" class="box"/>
  <text x="492.5" y="1139" text-anchor="middle" class="label bold">Weighted stream reduction</text>
  <text x="492.5" y="1169" text-anchor="middle" class="math">mᶠ = ∑ₛ aᶠₛ zₛ</text>
  <rect x="335" y="1215" width="315" height="42" rx="8" class="box"/>
  <text x="492.5" y="1242" text-anchor="middle" class="bold">uᶠ = RMSNorm(mᶠ)</text>

  <!-- MoE branch background intentionally does not cover its arrows. -->
  <rect x="308" y="1281" width="645" height="278" rx="11" fill="none" stroke="#aebcc3" stroke-width="1.5" stroke-dasharray="3 4"/>
  <text x="600" y="1306" class="label bold">ONE MoE APPLICATION</text>
  <rect x="335" y="1341" width="315" height="54" rx="8" class="box"/>
  <text x="492.5" y="1365" text-anchor="middle" class="bold">Router</text>
  <text x="492.5" y="1386" text-anchor="middle" class="small muted">selects only routed experts</text>
  <rect x="335" y="1421" width="315" height="60" rx="8" class="box"/>
  <text x="492.5" y="1446" text-anchor="middle" class="bold">Selected routed experts</text>
  <text x="492.5" y="1469" text-anchor="middle" class="small muted">router-weighted outputs</text>
  <rect x="702" y="1388" width="230" height="65" rx="8" class="box"/>
  <text x="817" y="1414" text-anchor="middle" class="bold">Shared expert</text>
  <text x="817" y="1437" text-anchor="middle" class="small muted">always included</text>
  <circle cx="650" cy="1511" r="9" fill="#faf9f6" stroke="#202b32" stroke-width="2"/>
  <text x="650" y="1517" text-anchor="middle" class="small bold">+</text>
  <text x="680" y="1539" class="label">Combine expert outputs</text>

  <rect x="335" y="1595" width="610" height="51" rx="8" class="box"/>
  <text x="640" y="1617" text-anchor="middle" class="label bold">Shared branch output yᶠ</text>
  <text x="640" y="1638" text-anchor="middle" class="small muted">one 6,144-vector</text>
  <text x="948" y="1669" text-anchor="end" class="small blue">bᶠ: one write gate for each stream</text>
  <rect x="320" y="1695" width="637" height="76" rx="11" class="updatebox"/>
  <text x="639" y="1721" text-anchor="middle" class="label bold">Add the same output, with a separate gate for each stream</text>
  <text x="639" y="1756" text-anchor="middle" class="math">wₛ = zₛ + bᶠₛ yᶠ    for s = 1, 2, 3, 4</text>
  <rect x="45" y="1798" width="932" height="51" rx="9" class="carrier"/>
  <text x="65" y="1830" class="math bold">W</text>
  <text x="219" y="1830" text-anchor="middle">w₁</text>
  <text x="433" y="1830" text-anchor="middle">w₂</text>
  <text x="647" y="1830" text-anchor="middle">w₃</text>
  <text x="861" y="1830" text-anchor="middle">w₄</text>

  <text x="40" y="1905" class="label bold">The carrier stays four streams wide; only the branch computation is reduced to one stream.</text>
  <text x="40" y="1931" class="small muted">a = pre/read gates · b = post/write gates · A = Attention · f = FFN/MoE · s = stream index</text>
</svg>
